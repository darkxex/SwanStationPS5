# SwanStationPS5 - cloud build: the PS5 app folder.
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Download the result from the run's page: Artifacts > SwanStationPS5-PPSA98510.
# Unzip it and copy the PPSA98510 folder to /data/homebrew/ on the PS5.

name: Build SwanStationPS5

on:
  push:
    branches: [main, v2-vulkan]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ps5:
    name: PS5 app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      # SwanStation is the PS5 emulator.
      - name: Fetch submodules
        run: |
          git submodule update --init --recursive --depth=1 third_party/rcheevos
          git submodule update --init --depth=1 third_party/swanstation

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18 make ninja-build ccache \
            pkg-config tar unzip wget python3 python3-venv zstd

      - name: Restore downloaded SDK and libraries
        uses: actions/cache@v4
        with:
          path: |
            .deps/native
            .deps/pacbrew
            .deps/lapy
          key: deps-${{ runner.os }}-${{ hashFiles('tools/setup-*-dependencies.sh', 'tools/build-lapy-helper.py') }}

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: make

      - name: Check system module imports
        run: python3 tools/check-imports.py dist/PPSA98510/eboot.bin

      # Crash reports in SwanStationPS5.log give addresses as offsets from main();
      # this map turns them into function names.
      - name: Write the symbol map
        run: llvm-nm-18 -n --defined-only build/llvm-pie.elf > SwanStationPS5-symbols.txt

      - name: Upload the symbol map
        uses: actions/upload-artifact@v4
        with:
          name: SwanStationPS5-symbols
          path: SwanStationPS5-symbols.txt

      - name: Upload the app folder
        uses: actions/upload-artifact@v4
        with:
          name: SwanStationPS5-PPSA98510
          path: |
            dist/
            !dist/*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ps5]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SwanStationPS5-PPSA98510
          path: app
      - uses: actions/download-artifact@v4
        with:
          name: SwanStationPS5-symbols
          path: .
      - name: Package
        run: |
          name=SwanStationPS5-${GITHUB_REF_NAME}
          mkdir -p "$name/tools"
          cp -r app/PPSA98510 "$name/"
          cp tools/SwanStationPS5_sync.py tools/psx_disc.py "$name/tools/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$name/"
          zip -qr "$name.zip" "$name"
          echo "ZIP=$name.zip" >> "$GITHUB_ENV"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --latest=false: SwanStationPS5 2.0.0 updates from the release marked Latest and its
          # updater leaves the app unable to start, so v2.0.0 stays Latest; 2.1.1 and
          # later read the whole list of releases.
          gh release create "$GITHUB_REF_NAME" "$ZIP" SwanStationPS5-symbols.txt --title "SwanStationPS5 ${GITHUB_REF_NAME#v}" --generate-notes --latest=false
